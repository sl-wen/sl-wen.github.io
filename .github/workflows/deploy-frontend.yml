# 前端应用部署工作流
name: Deploy Frontend Application

on:
  # 在react分支有推送时触发前端部署
  push:
    branches: [ react ]
  # 允许手动触发部署
  workflow_dispatch:

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    
    steps:
    - name: Deploy Frontend to Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_IP }} 
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH }}
        port: 22
        timeout: 30s
        command_timeout: 3m
        script: |
          echo "=== 开始部署前端应用 ==="
          echo "时间: $(date)"
          echo "用户: $(whoami)"
          
          # 进入前端项目目录
          cd /var/www/blog
          
          # 显示当前状态
          echo "当前分支: $(git branch --show-current)"
          echo "当前提交: $(git log --oneline -n 1)"
          
          # 停止前端服务
          echo "停止blog服务..."
          sudo systemctl stop blog || echo "服务已停止"
          
          # 拉取最新代码
          echo "拉取最新前端代码..."
          OLD_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "unknown")
          
          if [ -n "$SSH_KEY" ]; then
            export GIT_SSH_COMMAND="ssh -i $SSH_KEY -o ConnectTimeout=10 -o StrictHostKeyChecking=no"
          fi
          
          if timeout 30 git fetch origin --prune; then
            git reset --hard origin/react
            git checkout react
            git clean -fd
            NEW_COMMIT=$(git rev-parse HEAD)
            echo "✅ 前端代码更新: $OLD_COMMIT -> $NEW_COMMIT"
          else
            echo "❌ 前端代码拉取失败，使用本地版本"
          fi
          
          # 快速清理和安装
          echo "快速清理和安装依赖..."
          rm -rf .next
          rm -rf node_modules/.cache
          
          # 使用标准构建命令，跳过 lint
          echo "开始构建（跳过 lint）..."
          if timeout 300 npm run build; then
            echo "✅ 前端构建完成"
          else
            echo "❌ 前端构建超时或失败"
            echo "构建日志:"
            npm run build 2>&1 | tail -100
            exit 1
          fi
          
          # 启动前端服务
          echo "启动前端服务..."
          sudo systemctl start blog
          
          # 快速检查服务状态
          echo "检查服务状态..."
          sleep 5
          
          if sudo systemctl is-active --quiet blog; then
            echo "✅ 前端服务启动成功"
          else
            echo "❌ 前端服务启动失败"
            sudo systemctl status blog --no-pager
            exit 1
          fi
          
          # 快速测试前端应用
          echo "测试前端应用..."
          if curl -f --connect-timeout 5 http://localhost:3000 > /dev/null 2>&1; then
            echo "✅ 前端应用响应正常"
          else
            echo "❌ 前端应用无响应"
            exit 1
          fi
          
          # 重启nginx
          if command -v nginx > /dev/null 2>&1; then
            echo "重启nginx..."
            sudo systemctl restart nginx || echo "nginx重启完成"
          fi
          
          echo "=== 前端部署完成 ==="
          echo "时间: $(date)"
          echo "服务状态: $(sudo systemctl is-active blog)"
          echo "当前提交: $(git log --oneline -n 1)"
          
          # 显示访问信息
          EXTERNAL_IP=$(curl -s --connect-timeout 3 ifconfig.me 2>/dev/null || echo "unknown")
          if [ "$EXTERNAL_IP" ]; then
            echo "🔗 前端访问地址: http://$EXTERNAL_IP"
          fi
          
          echo "🎉 前端部署成功完成！" 