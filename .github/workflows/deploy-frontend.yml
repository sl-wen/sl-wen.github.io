# 前端应用部署工作流
name: Deploy Frontend Application

on:
  # 在react分支有推送时触发前端部署
  push:
    branches: [ react ]
  # 允许手动触发部署
  workflow_dispatch:

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
    - name: Deploy Frontend to Server
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: ${{ secrets.SERVER_IP }} 
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH }}
        port: 22
        timeout: 30s
        command_timeout: 5m
        script: |
          echo "=== 开始部署前端应用 ==="
          echo "时间: $(date)"
          echo "用户: $(whoami)"
          
          # 进入前端项目目录
          cd /var/www/blog
          
          # 显示当前状态
          echo "当前分支: $(git branch --show-current)"
          echo "当前提交: $(git log --oneline -n 1)"
          
          
          echo "停止后端API服务..."
          sudo systemctl stop novel || echo "后端服务已停止"
          
          # 拉取最新代码
          echo "拉取最新前端代码..."
          OLD_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "unknown")
          
          if timeout 30 git fetch origin --prune; then
            git reset --hard origin/react
            git checkout react
            git clean -fd
            NEW_COMMIT=$(git rev-parse HEAD)
            echo "✅ 前端代码更新: $OLD_COMMIT -> $NEW_COMMIT"
          else
            echo "❌ 前端代码拉取失败，使用本地版本"
          fi
          
          npm ci
          
          # 使用标准构建命令
          if npm run build:fast; then
            echo "✅ 前端构建完成"
          else
            echo "❌ 前端构建失败"
            exit 1
          fi
          
          # 启动前端服务
          echo "启动前端服务..."
          pm2 delete blog 2>/dev/null || true
          pm2 start npm --name blog -- start

          
          # 快速测试前端应用
          echo "测试前端应用..."
          if curl -f --connect-timeout 5 http://localhost:3000 > /dev/null 2>&1; then
            echo "✅ 前端应用响应正常"
          else
            echo "❌ 前端应用无响应"
            exit 1
          fi
          
          sudo systemctl start novel
          
          if curl -f --connect-timeout 10 http://localhost:8000/ > /dev/null 2>&1; then
            echo "✅ 后端API响应正常"
          else
            echo "❌ 后端API无响应，检查端口..."
            netstat -tlnp | grep LISTEN
            exit 1
          fi

          sudo nginx -t
          sudo systemctl reload nginx
          
          echo "=== 前端部署完成 ==="
          echo "时间: $(date)"
          echo "当前提交: $(git log --oneline -n 1)"
          echo "内存使用: $(free -h | grep Mem | awk '{print $3 "/" $2}')"
          echo "🎉 前端部署成功完成！" 