# Ubuntu 24.04 服务器更新部署工作流
name: Deploy to Server

on:
  # 在react分支有推送时触发
  push:
    branches: [ react ]
  # 允许手动触发部署
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Deploy to Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_IP }} 
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        port: 22
        timeout: 30s
        command_timeout: 10m
        script: |
          echo "=== 开始部署 ==="
          echo "时间: $(date)"
          echo "用户: $(whoami)"
          echo "家目录: $HOME"
          
          # 进入项目目录
          cd /var/www/blog
          
          # 显示当前状态
          echo "当前分支: $(git branch --show-current)"
          echo "当前提交: $(git log --oneline -n 1)"
          echo "内存状态: $(free -h | grep Mem)"
          
          # 停止服务
          echo "停止blog服务..."
          sudo systemctl stop blog || echo "服务已停止"
          
          # 简单的进程清理 - 不使用pkill
          echo "清理进程..."
          sudo systemctl kill blog || echo "进程清理完成"
          sleep 2
          
          # 检查SSH密钥和配置
          echo "检查SSH环境..."
          echo "SSH密钥文件："
          ls -la ~/.ssh/ 2>/dev/null || echo "~/.ssh 目录不存在"
          ls -la /root/.ssh/ 2>/dev/null || echo "/root/.ssh 目录不存在"
          
          # 设置SSH环境变量
          export HOME=/root
          export SSH_AUTH_SOCK=""
          
          # 检查可用的SSH密钥
          SSH_KEY=""
          if [ -f /root/.ssh/id_ed25519 ]; then
            SSH_KEY="/root/.ssh/id_ed25519"
            echo "找到 Ed25519 密钥: $SSH_KEY"
          elif [ -f /root/.ssh/id_rsa ]; then
            SSH_KEY="/root/.ssh/id_rsa"
            echo "找到 RSA 密钥: $SSH_KEY"
          elif [ -f ~/.ssh/id_ed25519 ]; then
            SSH_KEY="~/.ssh/id_ed25519"
            echo "找到用户 Ed25519 密钥: $SSH_KEY"
          elif [ -f ~/.ssh/id_rsa ]; then
            SSH_KEY="~/.ssh/id_rsa"
            echo "找到用户 RSA 密钥: $SSH_KEY"
          else
            echo "❌ 未找到SSH密钥文件"
          fi
          
          # 启动SSH Agent并添加密钥
          if [ -n "$SSH_KEY" ]; then
            echo "配置SSH Agent..."
            eval "$(ssh-agent -s)"
            
            # 确保密钥权限正确
            chmod 600 "$SSH_KEY" 2>/dev/null || echo "无法修改密钥权限"
            
            # 添加密钥到SSH Agent
            ssh-add "$SSH_KEY" 2>/dev/null && echo "✅ SSH密钥已加载" || echo "⚠️ SSH密钥加载失败"
          fi
          
          # 检查和修复远程仓库配置
          echo "检查远程仓库配置..."
          CURRENT_REMOTE=$(git remote get-url origin 2>/dev/null || echo "")
          echo "当前远程仓库: $CURRENT_REMOTE"
          
          # 修复错误的SSH域名
          if [[ "$CURRENT_REMOTE" == *"ssh.github.com"* ]]; then
            echo "🔧 修复错误的SSH域名..."
            git remote set-url origin git@github.com:sl-wen/sl-wen.github.io.git
            echo "✅ 已修复为正确的GitHub SSH域名"
          fi
          
          # 验证SSH连接
          echo "验证SSH连接..."
          SSH_TEST=$(ssh -T git@github.com -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o BatchMode=yes 2>&1)
          if echo "$SSH_TEST" | grep -q "successfully authenticated"; then
            echo "✅ SSH连接验证成功"
            echo "认证信息: $SSH_TEST"
          else
            echo "⚠️ SSH连接验证失败: $SSH_TEST"
            echo "尝试使用替代方法..."
          fi
          
          # 拉取最新代码
          echo "拉取最新代码..."
          OLD_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "unknown")
          
          # 设置Git SSH命令，指定密钥文件
          if [ -n "$SSH_KEY" ]; then
            export GIT_SSH_COMMAND="ssh -i $SSH_KEY -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o BatchMode=yes"
          else
            export GIT_SSH_COMMAND="ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o BatchMode=yes"
          fi
          
          # 尝试拉取代码
          echo "使用Git SSH命令: $GIT_SSH_COMMAND"
          if timeout 30 git fetch origin --prune; then
            echo "✅ 代码拉取成功"
            git reset --hard origin/react
            git checkout react
            git clean -fd
            
            NEW_COMMIT=$(git rev-parse HEAD)
            if [ "$OLD_COMMIT" != "$NEW_COMMIT" ]; then
              echo "✅ 发现新提交，从 $OLD_COMMIT 更新到 $NEW_COMMIT"
            else
              echo "ℹ️ 已是最新版本，无需更新"
            fi
          else
            echo "❌ 代码拉取失败，使用本地版本继续部署"
            echo "Git状态: $(git status --porcelain 2>/dev/null || echo '无法获取Git状态')"
            echo "继续使用现有代码进行部署..."
          fi
          
          echo "代码更新完成"
          echo "最终提交: $(git log --oneline -n 1)"
          
          # 检查依赖更新
          if git diff HEAD~1 --name-only | grep -q "package.json"; then
            echo "检测到package.json变化，更新依赖..."
            npm install --production
            echo "依赖更新完成"
          else
            echo "依赖无变化，跳过安装"
          fi
          
          # 检查并安装缺失的开发依赖
          echo "检查ESLint依赖..."
          MISSING_DEPS=""
          
          # 检查必需的ESLint包
          if ! npm list eslint-plugin-react-hooks > /dev/null 2>&1; then
            MISSING_DEPS="$MISSING_DEPS eslint-plugin-react-hooks"
          fi
          
          if ! npm list @typescript-eslint/eslint-plugin > /dev/null 2>&1; then
            MISSING_DEPS="$MISSING_DEPS @typescript-eslint/eslint-plugin"
          fi
          
          if ! npm list @typescript-eslint/parser > /dev/null 2>&1; then
            MISSING_DEPS="$MISSING_DEPS @typescript-eslint/parser"
          fi
          
          if [ -n "$MISSING_DEPS" ]; then
            echo "安装缺失的ESLint依赖: $MISSING_DEPS"
            npm install --save-dev $MISSING_DEPS || echo "部分ESLint依赖安装失败，继续构建"
          else
            echo "✅ ESLint依赖完整"
          fi
          
          # 构建应用
          echo "构建应用..."
          export NODE_OPTIONS="--max-old-space-size=512"
          export NODE_ENV=production
          
          # 清理旧构建
          rm -rf .next
          
          # 构建应用
          if npm run build; then
            echo "✅ 构建完成"
          else
            echo "❌ 构建失败"
            exit 1
          fi
          
          # 启动服务
          echo "启动blog服务..."
          sudo systemctl start blog
          
          # 等待服务启动
          echo "等待服务启动..."
          sleep 10
          
          # 检查服务状态
          if sudo systemctl is-active --quiet blog; then
            echo "✅ blog服务启动成功"
          else
            echo "❌ blog服务启动失败，查看状态："
            sudo systemctl status blog --no-pager
            exit 1
          fi
          
          # 检查端口
          echo "检查端口..."
          sleep 5
          if netstat -tlnp | grep -q ":3000"; then
            echo "✅ 端口3000已监听"
          else
            echo "❌ 端口3000未监听"
            netstat -tlnp | grep LISTEN
            exit 1
          fi
          
          # 测试应用响应
          echo "测试应用响应..."
          sleep 5
          if curl -f --connect-timeout 10 http://localhost:3000 > /dev/null 2>&1; then
            echo "✅ 应用响应正常"
          else
            echo "❌ 应用无响应，等待更长时间..."
            sleep 10
            if curl -f --connect-timeout 10 http://localhost:3000 > /dev/null 2>&1; then
              echo "✅ 应用响应正常"
            else
              echo "❌ 应用仍无响应"
              sudo journalctl -u blog --no-pager -n 10
              exit 1
            fi
          fi
          
          # 重启nginx
          if command -v nginx > /dev/null 2>&1; then
            echo "重启nginx..."
            sudo systemctl restart nginx || echo "nginx重启完成"
          fi
          
          echo "=== 部署完成 ==="
          echo "时间: $(date)"
          echo "服务状态: $(sudo systemctl is-active blog)"
          echo "内存使用: $(free -h | grep Mem | awk '{print $3 "/" $2}')"
          echo "当前提交: $(git log --oneline -n 1)"
          
          # 显示访问信息
          EXTERNAL_IP=$(curl -s --connect-timeout 5 ifconfig.me 2>/dev/null || echo "unknown")
          if [ "$EXTERNAL_IP" != "unknown" ]; then
            echo "🔗 访问地址: http://$EXTERNAL_IP"
          fi
          
          echo "🎉 部署成功完成！"
