# 全栈应用部署工作流 - 前端 + Python后端API
name: Deploy Full Stack Application

on:
  # 在react分支有推送时触发前端部署
  push:
    branches: [ react ]
  # 允许手动触发部署
  workflow_dispatch:
    inputs:
      deploy_frontend:
        description: '部署前端应用'
        required: false
        default: 'true'
      deploy_backend:
        description: '部署后端API'
        required: false
        default: 'true'

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/react' || github.event.inputs.deploy_frontend == 'true'
    
    steps:
    - name: Deploy Frontend to Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_IP }} 
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        port: 22
        timeout: 30s
        command_timeout: 10m
        script: |
          echo "=== 开始部署前端应用 ==="
          echo "时间: $(date)"
          echo "用户: $(whoami)"
          
          # 进入前端项目目录
          cd /var/www/blog
          
          # 显示当前状态
          echo "当前分支: $(git branch --show-current)"
          echo "当前提交: $(git log --oneline -n 1)"
          
          # 停止前端服务
          echo "停止blog服务..."
          sudo systemctl stop blog || echo "服务已停止"
          
          # 检查SSH环境
          echo "检查SSH环境..."
          export HOME=/root
          export SSH_AUTH_SOCK=""
          
          # 检查SSH密钥
          SSH_KEY=""
          if [ -f /root/.ssh/id_ed25519 ]; then
            SSH_KEY="/root/.ssh/id_ed25519"
          elif [ -f /root/.ssh/id_rsa ]; then
            SSH_KEY="/root/.ssh/id_rsa"
          fi
          
          if [ -n "$SSH_KEY" ]; then
            eval "$(ssh-agent -s)"
            chmod 600 "$SSH_KEY" 2>/dev/null
            ssh-add "$SSH_KEY" 2>/dev/null && echo "✅ SSH密钥已加载"
          fi
          
          # 修复GitHub SSH域名
          CURRENT_REMOTE=$(git remote get-url origin 2>/dev/null || echo "")
          if [[ "$CURRENT_REMOTE" == *"ssh.github.com"* ]]; then
            git remote set-url origin git@github.com:sl-wen/sl-wen.github.io.git
          fi
          
          # 拉取最新代码
          echo "拉取最新前端代码..."
          OLD_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "unknown")
          
          if [ -n "$SSH_KEY" ]; then
            export GIT_SSH_COMMAND="ssh -i $SSH_KEY -o ConnectTimeout=10 -o StrictHostKeyChecking=no"
          fi
          
          if timeout 30 git fetch origin --prune; then
            git reset --hard origin/react
            git checkout react
            git clean -fd
            NEW_COMMIT=$(git rev-parse HEAD)
            echo "✅ 前端代码更新: $OLD_COMMIT -> $NEW_COMMIT"
          else
            echo "❌ 前端代码拉取失败，使用本地版本"
          fi
          
          # 检查依赖更新
          if git diff HEAD~1 --name-only | grep -q "package.json"; then
            echo "更新前端依赖..."
            npm install --production
          fi
          
          # 检查ESLint依赖
          MISSING_DEPS=""
          if ! npm list eslint-plugin-react-hooks > /dev/null 2>&1; then
            MISSING_DEPS="$MISSING_DEPS eslint-plugin-react-hooks"
          fi
          if ! npm list @typescript-eslint/eslint-plugin > /dev/null 2>&1; then
            MISSING_DEPS="$MISSING_DEPS @typescript-eslint/eslint-plugin"
          fi
          if ! npm list @typescript-eslint/parser > /dev/null 2>&1; then
            MISSING_DEPS="$MISSING_DEPS @typescript-eslint/parser"
          fi
          
          if [ -n "$MISSING_DEPS" ]; then
            echo "安装缺失的ESLint依赖: $MISSING_DEPS"
            npm install --save-dev $MISSING_DEPS
          fi
          
          # 构建前端应用
          echo "构建前端应用..."
          export NODE_OPTIONS="--max-old-space-size=512"
          export NODE_ENV=production
          
          rm -rf .next
          
          if npm run build; then
            echo "✅ 前端构建完成"
          else
            echo "❌ 前端构建失败"
            exit 1
          fi
          
          # 启动前端服务
          echo "启动前端服务..."
          sudo systemctl start blog
          
          # 等待服务启动
          sleep 10
          
          if sudo systemctl is-active --quiet blog; then
            echo "✅ 前端服务启动成功"
          else
            echo "❌ 前端服务启动失败"
            sudo systemctl status blog --no-pager
            exit 1
          fi
          
          # 测试前端应用
          sleep 5
          if curl -f --connect-timeout 10 http://localhost:3000 > /dev/null 2>&1; then
            echo "✅ 前端应用响应正常"
          else
            echo "❌ 前端应用无响应"
            exit 1
          fi
          
          echo "=== 前端部署完成 ==="

  deploy-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.inputs.deploy_backend == 'true'
    
    steps:
    - name: Deploy Backend API to Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_IP }} 
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        port: 22
        timeout: 30s
        command_timeout: 15m
        script: |
          echo "=== 开始部署后端API ==="
          echo "时间: $(date)"
          echo "用户: $(whoami)"
          
          # 进入后端项目目录
          cd /var/www/novel
          
          # 显示当前状态
          echo "当前分支: $(git branch --show-current)"
          echo "当前提交: $(git log --oneline -n 1)"
          
          # 停止后端服务
          echo "停止后端API服务..."
          sudo systemctl stop novel-api || echo "后端服务已停止"
          
          # 检查SSH环境
          echo "检查SSH环境..."
          export HOME=/root
          export SSH_AUTH_SOCK=""
          
          # 检查SSH密钥
          SSH_KEY=""
          if [ -f /root/.ssh/id_ed25519 ]; then
            SSH_KEY="/root/.ssh/id_ed25519"
          elif [ -f /root/.ssh/id_rsa ]; then
            SSH_KEY="/root/.ssh/id_rsa"
          fi
          
          if [ -n "$SSH_KEY" ]; then
            eval "$(ssh-agent -s)"
            chmod 600 "$SSH_KEY" 2>/dev/null
            ssh-add "$SSH_KEY" 2>/dev/null && echo "✅ SSH密钥已加载"
          fi
          
          # 检查后端仓库是否存在，如果不存在则克隆
          if [ ! -d ".git" ]; then
            echo "后端仓库不存在，正在克隆..."
            if [ -n "$SSH_KEY" ]; then
              export GIT_SSH_COMMAND="ssh -i $SSH_KEY -o ConnectTimeout=10 -o StrictHostKeyChecking=no"
            fi
            git clone git@github.com:sl-wen/novel.git /var/www/novel
            cd /var/www/novel
            git checkout main
          else
            # 修复GitHub SSH域名
            CURRENT_REMOTE=$(git remote get-url origin 2>/dev/null || echo "")
            if [[ "$CURRENT_REMOTE" == *"ssh.github.com"* ]]; then
              git remote set-url origin git@github.com:sl-wen/novel.git
            fi
            
            # 拉取最新代码
            echo "拉取最新后端代码..."
            OLD_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "unknown")
            
            if [ -n "$SSH_KEY" ]; then
              export GIT_SSH_COMMAND="ssh -i $SSH_KEY -o ConnectTimeout=10 -o StrictHostKeyChecking=no"
            fi
            
            if timeout 30 git fetch origin --prune; then
              git reset --hard origin/main
              git checkout main
              git clean -fd
              NEW_COMMIT=$(git rev-parse HEAD)
              echo "✅ 后端代码更新: $OLD_COMMIT -> $NEW_COMMIT"
            else
              echo "❌ 后端代码拉取失败，使用本地版本"
            fi
          fi
          
          # 检查Python环境
          echo "检查Python环境..."
          if ! command -v python3 > /dev/null 2>&1; then
            echo "❌ Python3未安装"
            exit 1
          fi
          
          if ! command -v pip3 > /dev/null 2>&1; then
            echo "❌ pip3未安装"
            exit 1
          fi
          
          echo "Python版本: $(python3 --version)"
          echo "pip版本: $(pip3 --version)"
          
          # 检查虚拟环境
          if [ ! -d "venv" ]; then
            echo "创建Python虚拟环境..."
            python3 -m venv venv
          fi
          
          # 激活虚拟环境
          echo "激活虚拟环境..."
          source venv/bin/activate
          
          # 升级pip
          echo "升级pip..."
          pip install --upgrade pip
          
          # 检查依赖更新
          if git diff HEAD~1 --name-only | grep -q "requirements.txt"; then
            echo "更新后端依赖..."
            pip install -r requirements.txt
          else
            echo "检查后端依赖..."
            pip install -r requirements.txt
          fi
          
          # 数据库迁移（如果有）
          if [ -f "manage.py" ]; then
            echo "执行数据库迁移..."
            python manage.py migrate --noinput || echo "数据库迁移完成"
          fi
          
          # 收集静态文件（如果有）
          if [ -f "manage.py" ]; then
            echo "收集静态文件..."
            python manage.py collectstatic --noinput || echo "静态文件收集完成"
          fi
          
          # 启动后端服务
          echo "启动后端API服务..."
          sudo systemctl start novel-api
          
          # 等待服务启动
          sleep 15
          
          if sudo systemctl is-active --quiet novel-api; then
            echo "✅ 后端API服务启动成功"
          else
            echo "❌ 后端API服务启动失败"
            sudo systemctl status novel-api --no-pager
            exit 1
          fi
          
          # 测试后端API
          sleep 5
          if curl -f --connect-timeout 10 http://localhost:8000/health > /dev/null 2>&1; then
            echo "✅ 后端API响应正常"
          elif curl -f --connect-timeout 10 http://localhost:8000/ > /dev/null 2>&1; then
            echo "✅ 后端API响应正常"
          else
            echo "❌ 后端API无响应，检查端口..."
            netstat -tlnp | grep LISTEN
            exit 1
          fi
          
          echo "=== 后端API部署完成 ==="

  deploy-nginx:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy-frontend, deploy-backend]
    if: always()
    
    steps:
    - name: Configure Nginx and Restart
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_IP }} 
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        port: 22
        timeout: 30s
        command_timeout: 5m
        script: |
          echo "=== 配置Nginx反向代理 ==="
          
          # 创建Nginx配置文件
          sudo tee /etc/nginx/sites-available/fullstack-app << 'EOF'
          server {
              listen 80;
              server_name _;
              
              # 前端应用
              location / {
                  proxy_pass http://localhost:3000;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_cache_bypass $http_upgrade;
              }
              
              # 后端API
              location /api/ {
                  proxy_pass http://localhost:8000/;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_cache_bypass $http_upgrade;
              }
              
              # 静态文件缓存
              location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
                  expires 1y;
                  add_header Cache-Control "public, immutable";
              }
          }
          EOF
          
          # 启用站点
          sudo ln -sf /etc/nginx/sites-available/fullstack-app /etc/nginx/sites-enabled/
          
          # 测试Nginx配置
          if sudo nginx -t; then
            echo "✅ Nginx配置正确"
            
            # 重启Nginx
            sudo systemctl restart nginx
            echo "✅ Nginx重启完成"
          else
            echo "❌ Nginx配置错误"
            exit 1
          fi
          
          # 检查服务状态
          echo "=== 服务状态检查 ==="
          echo "前端服务: $(sudo systemctl is-active blog)"
          echo "后端API服务: $(sudo systemctl is-active novel-api)"
          echo "Nginx服务: $(sudo systemctl is-active nginx)"
          
          # 显示访问信息
          EXTERNAL_IP=$(curl -s --connect-timeout 5 ifconfig.me 2>/dev/null || echo "unknown")
          if [ "$EXTERNAL_IP" != "unknown" ]; then
            echo "🔗 前端访问地址: http://$EXTERNAL_IP"
            echo "🔗 后端API地址: http://$EXTERNAL_IP/api/"
          fi
          
          echo "🎉 全栈应用部署完成！"

  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [deploy-nginx]
    if: always()
    
    steps:
    - name: Health Check
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_IP }} 
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        port: 22
        timeout: 30s
        command_timeout: 2m
        script: |
          echo "=== 健康检查 ==="
          
          # 检查前端服务
          if curl -f --connect-timeout 10 http://localhost:3000 > /dev/null 2>&1; then
            echo "✅ 前端服务正常"
          else
            echo "❌ 前端服务异常"
          fi
          
          # 检查后端API服务
          if curl -f --connect-timeout 10 http://localhost:8000/ > /dev/null 2>&1; then
            echo "✅ 后端API服务正常"
          else
            echo "❌ 后端API服务异常"
          fi
          
          # 检查Nginx服务
          if curl -f --connect-timeout 10 http://localhost/ > /dev/null 2>&1; then
            echo "✅ Nginx代理正常"
          else
            echo "❌ Nginx代理异常"
          fi
          
          # 显示系统资源
          echo "=== 系统资源 ==="
          echo "内存使用: $(free -h | grep Mem | awk '{print $3 "/" $2}')"
          echo "磁盘使用: $(df -h / | tail -1 | awk '{print $5}')"
          echo "CPU负载: $(uptime | awk -F'load average:' '{print $2}')"
          
          echo "🎉 健康检查完成！" 