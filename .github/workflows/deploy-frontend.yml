# 前端应用部署工作流
name: Deploy Frontend Application

on:
  # 在react分支有推送时触发前端部署
  push:
    branches: [ react ]
  # 允许手动触发部署
  workflow_dispatch:

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
    - name: Deploy Frontend to Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_IP }} 
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH }}
        port: 22
        timeout: 30s
        command_timeout: 15m
        script: |
          echo "=== 开始部署前端应用 ==="
          echo "时间: $(date)"
          echo "用户: $(whoami)"
          
          # 进入前端项目目录
          cd /var/www/blog
          
          # 显示当前状态
          echo "当前分支: $(git branch --show-current)"
          echo "当前提交: $(git log --oneline -n 1)"
          
          # 停止前端服务
          echo "停止blog服务..."
          sudo systemctl stop blog || echo "服务已停止"
          
          # 检查SSH环境
          echo "检查SSH环境..."
          export HOME=/root
          export SSH_AUTH_SOCK=""
          
          # 检查SSH密钥
          SSH_KEY=""
          if [ -f /root/.ssh/id_ed25519 ]; then
            SSH_KEY="/root/.ssh/id_ed25519"
          elif [ -f /root/.ssh/id_rsa ]; then
            SSH_KEY="/root/.ssh/id_rsa"
          fi
          
          if [ -n "$SSH_KEY" ]; then
            eval "$(ssh-agent -s)"
            chmod 600 "$SSH_KEY" 2>/dev/null
            ssh-add "$SSH_KEY" 2>/dev/null && echo "✅ SSH密钥已加载"
          fi
          
          # 修复GitHub SSH域名
          CURRENT_REMOTE=$(git remote get-url origin 2>/dev/null || echo "")
          if [[ "$CURRENT_REMOTE" == *"ssh.github.com"* ]]; then
            git remote set-url origin git@github.com:sl-wen/sl-wen.github.io.git
          fi
          
          # 拉取最新代码
          echo "拉取最新前端代码..."
          OLD_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "unknown")
          
          if [ -n "$SSH_KEY" ]; then
            export GIT_SSH_COMMAND="ssh -i $SSH_KEY -o ConnectTimeout=10 -o StrictHostKeyChecking=no"
          fi
          
          if timeout 30 git fetch origin --prune; then
            git reset --hard origin/react
            git checkout react
            git clean -fd
            NEW_COMMIT=$(git rev-parse HEAD)
            echo "✅ 前端代码更新: $OLD_COMMIT -> $NEW_COMMIT"
          else
            echo "❌ 前端代码拉取失败，使用本地版本"
          fi
          
          # 清理旧的构建缓存
          echo "清理构建缓存..."
          rm -rf .next
          rm -rf node_modules/.cache
          
          # 强制重新安装依赖以解决SWC问题
          echo "重新安装依赖..."
          rm -f package-lock.json
          npm cache clean --force
          
          # 安装生产依赖
          echo "安装生产依赖..."
          npm install --production=false --prefer-offline=false
          
          # 检查SWC依赖
          echo "检查SWC依赖..."
          if ! npm list @next/swc > /dev/null 2>&1; then
            echo "⚠️  SWC依赖缺失，强制重新安装..."
            npm install @next/swc --force
          fi
          
          # 检查其他关键依赖
          echo "检查关键依赖..."
          MISSING_DEPS=""
          if ! npm list eslint-plugin-react-hooks > /dev/null 2>&1; then
            MISSING_DEPS="$MISSING_DEPS eslint-plugin-react-hooks"
          fi
          if ! npm list @typescript-eslint/eslint-plugin > /dev/null 2>&1; then
            MISSING_DEPS="$MISSING_DEPS @typescript-eslint/eslint-plugin"
          fi
          if ! npm list @typescript-eslint/parser > /dev/null 2>&1; then
            MISSING_DEPS="$MISSING_DEPS @typescript-eslint/parser"
          fi
          
          if [ -n "$MISSING_DEPS" ]; then
            echo "安装缺失的ESLint依赖: $MISSING_DEPS"
            npm install --save-dev $MISSING_DEPS
          fi
          
          # 验证依赖完整性
          echo "验证依赖完整性..."
          npm audit --audit-level=moderate || echo "⚠️  发现依赖安全问题，但继续构建"
          
          # 构建前端应用
          echo "构建前端应用..."
          export NODE_OPTIONS="--max-old-space-size=1024"
          export NODE_ENV=production
          export NEXT_TELEMETRY_DISABLED=1
          
          # 使用更快的构建命令
          if npm run build:fast; then
            echo "✅ 前端构建完成"
          else
            echo "❌ 快速构建失败，尝试标准构建..."
            if npm run build; then
              echo "✅ 标准构建完成"
            else
              echo "❌ 前端构建失败"
              echo "构建日志:"
              npm run build 2>&1 | tail -50
              exit 1
            fi
          fi
          
          # 启动前端服务
          echo "启动前端服务..."
          sudo systemctl start blog
          
          # 等待服务启动
          echo "等待服务启动..."
          for i in {1..30}; do
            if sudo systemctl is-active --quiet blog; then
              echo "✅ 前端服务启动成功 (${i}s)"
              break
            fi
            sleep 1
          done
          
          if ! sudo systemctl is-active --quiet blog; then
            echo "❌ 前端服务启动失败"
            sudo systemctl status blog --no-pager
            exit 1
          fi
          
          # 测试前端应用
          echo "测试前端应用..."
          for i in {1..10}; do
            if curl -f --connect-timeout 10 http://localhost:3000 > /dev/null 2>&1; then
              echo "✅ 前端应用响应正常 (${i}s)"
              break
            fi
            sleep 2
          done
          
          if ! curl -f --connect-timeout 10 http://localhost:3000 > /dev/null 2>&1; then
            echo "❌ 前端应用无响应"
            exit 1
          fi
          
          # 重启nginx
          if command -v nginx > /dev/null 2>&1; then
            echo "重启nginx..."
            sudo systemctl restart nginx || echo "nginx重启完成"
          fi
          
          echo "=== 前端部署完成 ==="
          echo "时间: $(date)"
          echo "服务状态: $(sudo systemctl is-active blog)"
          echo "内存使用: $(free -h | grep Mem | awk '{print $3 "/" $2}')"
          echo "当前提交: $(git log --oneline -n 1)"
          
          # 显示访问信息
          EXTERNAL_IP=$(curl -s --connect-timeout 5 ifconfig.me 2>/dev/null || echo "unknown")
          if [ "$EXTERNAL_IP" != "unknown" ]; then
            echo "🔗 前端访问地址: http://$EXTERNAL_IP"
          fi
          
          echo "🎉 前端部署成功完成！" 